name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/pirror-responsive-website-w79s75
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The unlisted preview page's address comes from the PREVIEW_SLUG
      # repository secret, so it never appears in this public repository
      # (lib/siteMode.ts). Without the secret there is no preview page.
      - name: Add the unlisted preview page
        env:
          PREVIEW_SLUG: ${{ secrets.PREVIEW_SLUG }}
        run: |
          if [ -z "$PREVIEW_SLUG" ]; then
            echo "No PREVIEW_SLUG secret: building without a preview page."
          elif [[ ! "$PREVIEW_SLUG" =~ ^[a-z0-9-]+$ ]]; then
            echo "PREVIEW_SLUG may only use a-z, 0-9 and -." && exit 1
          else
            mkdir -p "app/$PREVIEW_SLUG"
            cp -R preview-template/. "app/$PREVIEW_SLUG/"
          fi
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Custom domain (saved under Settings → Pages → Custom domain).
          # The site is served from the domain root, so next.config.ts
          # drops the /web base path; mimmimtst-svg.github.io/web/
          # redirects to it.
          PAGES_CUSTOM_DOMAIN: byunghyun.kr
          # Private for now: byunghyun.kr shows a "coming soon" page and
          # the site lives at the unlisted preview address (lib/siteMode.ts).
          # Delete this line and push to make the site public.
          NEXT_PUBLIC_SITE_PRIVATE: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
