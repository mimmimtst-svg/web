name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/pirror-responsive-website-w79s75
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Custom domain: once byunghyun.kr is saved under Settings → Pages
          # → Custom domain, uncomment this so next.config.ts drops the /web
          # base path (the site is then served from the domain root). Left
          # off until then so mimmimtst-svg.github.io/web/ keeps working.
          # PAGES_CUSTOM_DOMAIN: byunghyun.kr
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
